[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "keyprism"
version = "0.3.3"
description = "KeyPrism — piano-key spectrogram player: resolve audio into a semitone-grid spectrum with synced interactive playback"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "soundfile>=0.12",
    "av>=11.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

# Default package index is the TUNA mirror (official PyPI is unreachable
# from some networks)
[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.hatch.build.targets.wheel]
packages = ["src/keyprism"]

[tool.pytest.ini_options]
testpaths = ["tests"]
