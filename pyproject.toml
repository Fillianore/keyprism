[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "keyprism"
version = "0.4.1"
description = "KeyPrism — piano-key spectrogram player: resolve audio into a semitone-grid spectrum with synced interactive playback"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "soundfile>=0.12",
    "av>=11.0",
    "mido>=1.3",
]

[project.optional-dependencies]
# Transcription evaluation only (scripts/eval_trans.py); never required by
# tests or runtime
eval = [
    "mir_eval>=0.8",
]
# Deep-learning separation/transcription (Phase 3): strictly optional —
# the app degrades to the Phase 2 pipeline (API answers 501) when absent
dl = [
    "onnxruntime>=1.17",
    "basic-pitch>=0.4.0",
    "huggingface-hub>=0.23",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

# Default package index is the TUNA mirror (official PyPI is unreachable
# from some networks)
[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.hatch.build.targets.wheel]
packages = ["src/keyprism"]

[tool.pytest.ini_options]
testpaths = ["tests"]
