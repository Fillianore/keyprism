# CI: mandatory bottom-line verification
# Purpose: automatically run the regression tests and the frontend build
# before any change is merged; test rot is intercepted here
# (a red build forces a choice: fix the code, or consciously update/remove
# the outdated tests) instead of relying on someone remembering to run them.
# Toolchain notes: the av/soundfile wheels bundle ffmpeg/libsndfile, so no apt
# system packages are needed; pyproject sets the TUNA mirror as the default
# index, which GitHub runners (overseas) can reach just as well.

name: CI

on:
  push:
    branches: [master, devel]
  pull_request:

jobs:
  backend:
    name: Backend (uv sync + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies (incl. dev test group)
        run: uv sync

      - name: Launch script syntax check
        run: bash -n scripts/start.sh

      - name: Regression tests (30 cases, ~6s)
        run: uv run pytest -q

  frontend:
    name: Frontend (npm ci + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # vite 7 requires >= 20.19

      - name: Install dependencies
        run: npm ci

      - name: i18n key-completeness check (en + zh)
        run: npm run check:i18n

      - name: Mixer transition-table test (T1-T5, I1)
        run: npm run test:mixer

      - name: Production build
        run: npm run build
